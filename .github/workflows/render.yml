name: Render Remotion Video
on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Render Video
        run: npx remotion render src/index.ts GolfFact out/venus-video.mp4

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: venus-fact-video
          path: out/venus-video.mp4
